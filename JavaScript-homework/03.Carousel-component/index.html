<!DOCTYPE html>
<html lang="ko-KR">

<head>
  <meta charset="UTF-8" />
  <title>Carousel Component</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel=" icon" href="./images/game-icon.png" type="image/png" />
  <link rel="stylesheet" href="./styles/carousel.css" />
  <script src="./scripts/carousel.js" defer></script>
</head>

<!--헤드, 콘텐츠, 탐색을 포함한 바디-->

<body class="carousel-body">
  <!--헤드 타이틀 영역-->
  <section aria-labelledby="recommend-title">
    <header class="recommend-game-header">
      <a href="https://kakaogames.com/" class="title-link">
        <img src="./images/game-icon.png" alt="" aria-hidden="true" />
        <h2 id="recommend-title">추천 게임</h2>
        <img src="./images/stroke-right.svg" class="arrow-icon" alt="" aria-hidden="true" />
      </a>
    </header>

    <ul class="card-component">
      <li>
        <article class="game-card">
          <a href="https://chronoodyssey.kakaogames.com/ko/">
            <div class="image-container">
              <div class="bg-layer">
                <img src="./images/bg.webp" alt="" />
              </div>
              <img src="./images/character.webp" alt="크로노 오디세이" class="character" />
            </div>
            <h3>크로노 오디세이</h3>
            <p class="description">멈춰 있던 시간이 흐른다</p>
            <p class="category">MMORPG</p>
          </a>
        </article>
      </li>

      <li>
        <article class="game-card">
          <a href="https://aw.kakaogames.com/">
            <div class="image-container">
              <div class="bg-layer">
                <img src="./images/bg1.webp" alt="" />
              </div>
              <img src="./images/character1.webp" alt="아키에이지 워" class="character" />
            </div>
            <h3>아키에이지 워</h3>
            <p class="description">시대의 전설을 향해</p>
            <p class="category">MMORPG</p>
          </a>
        </article>
      </li>
    </ul>

    <footer class="slide-control">
      <button type="button">
        <img src="./images/stroke-left.svg" alt="이전" />
      </button>
      <div class="page-indicator">1 / 3</div>
      <button type="button">
        <img src="./images/stroke-right.svg" alt="다음" />
      </button>
    </footer>
  </section>

</body>

</html>
